<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="50%" stop-color="#111d33" />
      <stop offset="100%" stop-color="#060b14" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad2)" />
  
  <!-- Dashboard Frame -->
  <rect x="80" y="50" width="640" height="350" rx="12" fill="rgba(15,23,42,0.9)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" />
  
  <!-- Title bar -->
  <rect x="80" y="50" width="640" height="38" rx="12" fill="rgba(30,41,59,0.8)" />
  <circle cx="105" cy="69" r="5" fill="#ef4444" />
  <circle cx="120" cy="69" r="5" fill="#f59e0b" />
  <circle cx="135" cy="69" r="5" fill="#10b981" />
  <text x="400" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">FC26 Automation Engine — 100-Thread Concurrency Telemetry</text>

  <!-- 4 KPI Badges -->
  <rect x="105" y="105" width="135" height="60" rx="8" fill="rgba(30,41,59,0.5)" stroke="rgba(56,189,248,0.2)" />
  <text x="120" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10">ACTIVE WORKERS</text>
  <text x="120" y="152" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="700">20 / 20</text>

  <rect x="252" y="105" width="135" height="60" rx="8" fill="rgba(30,41,59,0.5)" stroke="rgba(16,185,129,0.2)" />
  <text x="267" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10">PROXY VALIDATOR</text>
  <text x="267" y="152" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="700">100 Threads</text>

  <rect x="399" y="105" width="135" height="60" rx="8" fill="rgba(30,41,59,0.5)" stroke="rgba(245,158,11,0.2)" />
  <text x="414" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10">THROUGHPUT</text>
  <text x="414" y="152" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="700">450 acc/min</text>

  <rect x="546" y="105" width="150" height="60" rx="8" fill="rgba(30,41,59,0.5)" stroke="rgba(129,140,248,0.2)" />
  <text x="561" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10">TAXONOMY</text>
  <text x="561" y="152" fill="#a78bfa" font-family="sans-serif" font-size="20" font-weight="700">34 Buckets</text>

  <!-- Live Producer/Consumer Thread Graph -->
  <rect x="105" y="180" width="370" height="200" rx="8" fill="rgba(11,20,38,0.8)" stroke="rgba(255,255,255,0.06)" />
  <text x="125" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Thread-Safe Producer / Consumer UiBridge</text>
  
  <!-- Flow Lines & Queues -->
  <rect x="125" y="225" width="80" height="35" rx="6" fill="#1e293b" stroke="#38bdf8" />
  <text x="165" y="247" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">Workers (1-20)</text>
  
  <line x1="205" y1="242" x2="250" y2="242" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  
  <rect x="250" y="225" width="90" height="35" rx="6" fill="#1e293b" stroke="#10b981" />
  <text x="295" y="247" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Callback Queue</text>
  
  <line x1="340" y1="242" x2="385" y2="242" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
  
  <rect x="385" y="225" width="75" height="35" rx="6" fill="#1e293b" stroke="#f59e0b" />
  <text x="422" y="247" fill="#fbbf24" font-family="sans-serif" font-size="10" text-anchor="middle">80ms UI Pump</text>

  <!-- Telemetry Table preview -->
  <rect x="125" y="280" width="335" height="85" rx="4" fill="rgba(15,23,42,0.6)" />
  <line x1="125" y1="302" x2="460" y2="302" stroke="rgba(255,255,255,0.06)" />
  <text x="135" y="296" fill="#64748b" font-family="sans-serif" font-size="9">TARGET</text>
  <text x="220" y="296" fill="#64748b" font-family="sans-serif" font-size="9">STATUS</text>
  <text x="310" y="296" fill="#64748b" font-family="sans-serif" font-size="9">PROXY LATENCY</text>
  <text x="410" y="296" fill="#64748b" font-family="sans-serif" font-size="9">ETA</text>
  
  <text x="135" y="320" fill="#cbd5e1" font-family="monospace" font-size="9">worker_07</text>
  <text x="220" y="320" fill="#34d399" font-family="sans-serif" font-size="9">SUCCESS_VERIFIED</text>
  <text x="310" y="320" fill="#38bdf8" font-family="sans-serif" font-size="9">42ms</text>
  <text x="410" y="320" fill="#94a3b8" font-family="sans-serif" font-size="9">00:03:12</text>

  <text x="135" y="342" fill="#cbd5e1" font-family="monospace" font-size="9">worker_12</text>
  <text x="220" y="342" fill="#fbbf24" font-family="sans-serif" font-size="9">RETRY_COOLDOWN</text>
  <text x="310" y="342" fill="#38bdf8" font-family="sans-serif" font-size="9">68ms</text>
  <text x="410" y="342" fill="#94a3b8" font-family="sans-serif" font-size="9">00:03:12</text>

  <!-- Right Side: Architecture Specs -->
  <rect x="490" y="180" width="206" height="200" rx="8" fill="rgba(11,20,38,0.8)" stroke="rgba(255,255,255,0.06)" />
  <text x="505" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Engine Features</text>
  <text x="505" y="235" fill="#94a3b8" font-family="sans-serif" font-size="10">⚡ 48-Source Concurrent Scraper</text>
  <text x="505" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">🔄 Dedupe Buffer (8k Proxies)</text>
  <text x="505" y="285" fill="#94a3b8" font-family="sans-serif" font-size="10">💾 Atomic JSON Persistence</text>
  <text x="505" y="310" fill="#94a3b8" font-family="sans-serif" font-size="10">📊 Sliding-Window Estimators</text>
  <text x="505" y="335" fill="#94a3b8" font-family="sans-serif" font-size="10">📁 TXT / JSON / CSV Exports</text>
  <text x="505" y="360" fill="#94a3b8" font-family="sans-serif" font-size="10">🛡️ Global Thread Exception Hooks</text>
</svg>
