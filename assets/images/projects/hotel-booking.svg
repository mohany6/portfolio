<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hotel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="hotel-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="hotel-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#hotel-bg)"/>

  <!-- Glowing Ambiance -->
  <circle cx="680" cy="100" r="150" fill="#38bdf8" opacity="0.12" filter="url(#hotel-glow)"/>
  <circle cx="150" cy="380" r="160" fill="#f59e0b" opacity="0.1" filter="url(#hotel-glow)"/>

  <!-- Browser Frame Mockup -->
  <rect x="60" y="45" width="680" height="360" rx="14" fill="url(#hotel-card)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M60,45 h680 a14,14 0 0 1 14,14 v32 h-708 v-32 a14,14 0 0 1 14,-14 z" fill="rgba(15, 23, 42, 0.95)"/>
  <circle cx="85" cy="68" r="5" fill="#ef4444"/>
  <circle cx="102" cy="68" r="5" fill="#f59e0b"/>
  <circle cx="119" cy="68" r="5" fill="#10b981"/>

  <!-- Address Bar -->
  <rect x="150" y="58" width="360" height="22" rx="11" fill="rgba(0, 0, 0, 0.45)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="175" y="73" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">https://grandstay.resorts.io/search?city=cairo&amp;rooms=deluxe</text>
  
  <!-- MEAN Stack Badge -->
  <rect x="610" y="58" width="115" height="22" rx="11" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1"/>
  <text x="622" y="73" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#fbbf24">● MEAN Stack</text>

  <!-- Hero Search Strip -->
  <g transform="translate(90, 105)">
    <rect x="0" y="0" width="620" height="65" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
    
    <!-- Destination -->
    <text x="20" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#94a3b8">DESTINATION</text>
    <text x="20" y="48" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Cairo, Egypt 🇪🇬</text>
    <line x1="160" y1="12" x2="160" y2="52" stroke="rgba(255, 255, 255, 0.1)"/>

    <!-- Dates -->
    <text x="180" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#94a3b8">CHECK-IN / OUT</text>
    <text x="180" y="48" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Dec 15 → Dec 22</text>
    <line x1="330" y1="12" x2="330" y2="52" stroke="rgba(255, 255, 255, 0.1)"/>

    <!-- Guests & Rooms -->
    <text x="350" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#94a3b8">GUESTS &amp; ROOMS</text>
    <text x="350" y="48" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#ffffff">2 Adults • 1 Deluxe King</text>

    <!-- Search Button -->
    <rect x="505" y="12" width="100" height="40" rx="8" fill="url(#cyan-grad)"/>
    <text x="532" y="37" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">SEARCH</text>
  </g>

  <!-- Hotel Listings Grid (2 Cards) -->
  <!-- Card 1 -->
  <g transform="translate(90, 190)">
    <rect x="0" y="0" width="300" height="195" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)"/>
    
    <!-- Image placeholder -->
    <rect x="0" y="0" width="300" height="95" rx="10" fill="rgba(15, 23, 42, 0.8)"/>
    <path d="M0,0 h300 v95 h-300 z" fill="rgba(14, 165, 233, 0.15)"/>
    <rect x="15" y="15" width="80" height="20" rx="10" fill="rgba(0, 0, 0, 0.6)"/>
    <text x="25" y="29" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#fbbf24">★ 5.0 LUXURY</text>

    <!-- Hotel Details -->
    <text x="15" y="120" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Grand Nile Tower &amp; Spa</text>
    <text x="15" y="138" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">📍 Garden City, Cairo • Nile Front</text>
    <text x="15" y="156" font-family="'Inter', sans-serif" font-size="10" fill="#10b981">✓ Free Cancellation • Pool &amp; Spa</text>

    <!-- Price & Book -->
    <text x="15" y="180" font-family="'Outfit', sans-serif" font-size="17" font-weight="800" fill="#38bdf8">$220<tspan font-size="10" fill="#94a3b8"> / night</tspan></text>
    <rect x="205" y="162" width="80" height="24" rx="6" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1"/>
    <text x="222" y="178" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">RESERVE</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(410, 190)">
    <rect x="0" y="0" width="300" height="195" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)"/>
    
    <!-- Image placeholder -->
    <rect x="0" y="0" width="300" height="95" rx="10" fill="rgba(15, 23, 42, 0.8)"/>
    <path d="M0,0 h300 v95 h-300 z" fill="rgba(245, 158, 11, 0.15)"/>
    <rect x="15" y="15" width="85" height="20" rx="10" fill="rgba(0, 0, 0, 0.6)"/>
    <text x="25" y="29" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#fbbf24">★ 5.0 RESORT</text>

    <!-- Hotel Details -->
    <text x="15" y="120" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Steigenberger Resort Soma Bay</text>
    <text x="15" y="138" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">📍 Hurghada, Red Sea • Private Beach</text>
    <text x="15" y="156" font-family="'Inter', sans-serif" font-size="10" fill="#10b981">✓ All Inclusive Option • Aqua Park</text>

    <!-- Price & Book -->
    <text x="15" y="180" font-family="'Outfit', sans-serif" font-size="17" font-weight="800" fill="#38bdf8">$190<tspan font-size="10" fill="#94a3b8"> / night</tspan></text>
    <rect x="205" y="162" width="80" height="24" rx="6" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1"/>
    <text x="222" y="178" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">RESERVE</text>
  </g>
</svg>
