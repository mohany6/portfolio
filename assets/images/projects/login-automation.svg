    <text x="20" y="170" fill="#94a3b8" font-family="monospace" font-size="11">[15:42:02.810] <tspan fill="#a78bfa">PERSIST</tspan> Serialized session state: active_session_01.json</text>
    <text x="20" y="195" fill="#94a3b8" font-family="monospace" font-size="11">[15:42:03.200] <tspan fill="#fbbf24">WARN</tspan> Rate-limit flag detected on Worker-04. Exponential backoff (1.5s).</text>
    <text x="20" y="220" fill="#94a3b8" font-family="monospace" font-size="11">[15:42:04.700] <tspan fill="#38bdf8">INFO</tspan> Auto-reconnected Worker-04 with clean fingerprint.</text>
    <text x="20" y="245" fill="#94a3b8" font-family="monospace" font-size="11">[15:42:05.100] <tspan fill="#34d399">PASS</tspan> All 8 instances verified &amp; ready.</text>
