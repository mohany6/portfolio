    <line x1="0" y1="42" x2="430" y2="42" stroke="rgba(255,255,255,0.06)" />

    <text x="20" y="70" fill="#94a3b8" font-family="monospace" font-size="11">[15:42:01.102] <tspan fill="#38bdf8">INFO</tspan> Pool spawned 8 worker threads via multiprocessing.</text>
    <text x="20" y="95" fill="#94a3b8" font-family="monospace" font-size="11">[15:42:01.450] <tspan fill="#2dd4bf">AUTH</tspan> Hooked proxy context: Socks5://192.168.1.12:8080</text>
    <text x="20" y="120" fill="#94a3b8" font-family="monospace" font-size="11">[15:42:02.120] <tspan fill="#34d399">PASS</tspan> Intercepted SMS MFA code from IMAP queue.</text>
