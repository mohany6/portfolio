<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="laravel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d20"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="120" r="140" fill="#ff2d20" opacity="0.12" filter="url(#glow)"/>
  <circle cx="650" cy="320" r="160" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>

  <!-- Main App Window Frame -->
  <rect x="70" y="55" width="660" height="340" rx="14" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <path d="M70,55 h660 a14,14 0 0 1 14,14 v30 h-688 v-30 a14,14 0 0 1 14,-14 z" fill="rgba(15, 23, 42, 0.95)"/>
  <circle cx="95" cy="77" r="5" fill="#ef4444"/>
  <circle cx="112" cy="77" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="77" r="5" fill="#10b981"/>
  
  <!-- Address Bar -->
  <rect x="160" y="67" width="340" height="20" rx="10" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="180" y="81" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">https://laravel.customermanager.local/dashboard</text>
  
  <!-- Laravel Badge in Header -->
  <rect x="620" y="66" width="95" height="22" rx="11" fill="rgba(255, 45, 32, 0.2)" stroke="#ff2d20" stroke-width="1"/>
  <text x="633" y="81" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ff2d20">● Laravel 11</text>

  <!-- Sidebar -->
  <rect x="70" y="99" width="150" height="296" fill="rgba(15, 23, 42, 0.6)" stroke-right="rgba(255, 255, 255, 0.06)"/>
  <text x="95" y="135" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">📊 Analytics</text>
  <rect x="85" y="152" width="120" height="28" rx="6" fill="rgba(255, 45, 32, 0.25)" stroke="rgba(255, 45, 32, 0.4)"/>
  <text x="95" y="170" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" fill="#ff2d20">👥 Customers</text>
  <text x="95" y="205" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8">📦 Orders</text>
  <text x="95" y="235" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8">🧾 Invoices</text>
  <text x="95" y="265" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8">⚙️ Settings</text>

  <!-- Main Content Area -->
  <!-- Stats Row -->
  <g transform="translate(240, 115)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="140" height="60" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="12" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">TOTAL CUSTOMERS</text>
    <text x="12" y="48" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">1,482</text>
    
    <!-- Stat 2 -->
    <rect x="155" y="0" width="140" height="60" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="167" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">ACTIVE ORDERS</text>
    <text x="167" y="48" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">394</text>
    
    <!-- Stat 3 -->
    <rect x="310" y="0" width="155" height="60" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="322" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">REVENUE (MONTH)</text>
    <text x="322" y="48" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#10b981">$48,250</text>
  </g>

  <!-- Table View -->
  <g transform="translate(240, 190)">
    <rect x="0" y="0" width="465" height="185" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="465" height="28" fill="rgba(30, 41, 59, 0.8)"/>
    <text x="15" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">NAME</text>
    <text x="120" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">EMAIL</text>
    <text x="240" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">ORDERS</text>
    <text x="320" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">STATUS</text>
    <text x="400" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">ACTIONS</text>

    <!-- Row 1 -->
    <text x="15" y="52" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Sarah Jenkins</text>
    <text x="120" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">sarah@corp.io</text>
    <text x="240" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">14 Orders</text>
    <rect x="320" y="40" width="55" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="330" y="53" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#10b981">ACTIVE</text>
    <text x="400" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">Edit • Del</text>
    <line x1="10" y1="65" x2="455" y2="65" stroke="rgba(255, 255, 255, 0.05)"/>

    <!-- Row 2 -->
    <text x="15" y="88" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Alex Mercer</text>
    <text x="120" y="88" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">alex.m@dev.com</text>
    <text x="240" y="88" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">6 Orders</text>
    <rect x="320" y="76" width="55" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="330" y="89" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#10b981">ACTIVE</text>
    <text x="400" y="88" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">Edit • Del</text>
    <line x1="10" y1="101" x2="455" y2="101" stroke="rgba(255, 255, 255, 0.05)"/>

    <!-- Row 3 -->
    <text x="15" y="124" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Elena Rostova</text>
    <text x="120" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">elena@tech.de</text>
    <text x="240" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">28 Orders</text>
    <rect x="320" y="112" width="60" height="18" rx="9" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="328" y="125" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#f59e0b">PENDING</text>
    <text x="400" y="124" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">Edit • Del</text>
    <line x1="10" y1="137" x2="455" y2="137" stroke="rgba(255, 255, 255, 0.05)"/>

    <!-- Row 4 -->
    <text x="15" y="160" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Marcus Vance</text>
    <text x="120" y="160" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">m.vance@logistics.uk</text>
    <text x="240" y="160" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">3 Orders</text>
    <rect x="320" y="148" width="55" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="330" y="161" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#10b981">ACTIVE</text>
    <text x="400" y="160" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">Edit • Del</text>
  </g>
</svg>
