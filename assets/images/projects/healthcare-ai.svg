<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f1f3d" />
      <stop offset="100%" stop-color="#060b18" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Central Glowing Ambient Circle -->
  <circle cx="400" cy="225" r="160" fill="rgba(6,182,212,0.06)" filter="url(#glow)" />
  <circle cx="400" cy="225" r="110" fill="none" stroke="rgba(59,130,246,0.25)" stroke-width="1.5" stroke-dasharray="6,6" />

  <!-- UI Window Container -->
  <rect x="120" y="60" width="560" height="330" rx="14" fill="rgba(15,23,42,0.85)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" filter="url(#glow)" />
  
  <!-- Window Header -->
  <rect x="120" y="60" width="560" height="40" rx="14" fill="rgba(30,41,59,0.7)" />
  <circle cx="145" cy="80" r="5" fill="#ef4444" />
  <circle cx="160" cy="80" r="5" fill="#f59e0b" />
  <circle cx="175" cy="80" r="5" fill="#10b981" />
  <text x="400" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">MyHealthAI — Telemedicine &amp; AI Diagnostic Portal</text>

  <!-- Left Column: Medical AI / Lung Diagnostics Visualization -->
  <rect x="150" y="120" width="220" height="240" rx="10" fill="rgba(11,20,38,0.9)" stroke="rgba(6,182,212,0.25)" stroke-width="1" />
  <text x="170" y="145" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CHEST X-RAY AI SCANNER</text>
  
  <!-- Stylized Lungs / Neural Nodes Graphic -->
  <path d="M 220 180 C 190 190, 180 230, 200 260 C 215 280, 235 270, 235 240 Z" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="3,3" />
  <path d="M 300 180 C 330 190, 340 230, 320 260 C 305 280, 285 270, 285 240 Z" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="3,3" />
  <line x1="260" y1="165" x2="260" y2="280" stroke="#3b82f6" stroke-width="2" />
  <circle cx="260" cy="200" r="4" fill="#10b981" />
  <circle cx="220" cy="220" r="4" fill="#06b6d4" />
  <circle cx="300" cy="220" r="4" fill="#06b6d4" />
  <circle cx="240" cy="250" r="3" fill="#3b82f6" />
  <circle cx="280" cy="250" r="3" fill="#3b82f6" />
  
  <!-- AI Confidence Bar -->
  <rect x="170" y="300" width="180" height="24" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1" />
  <text x="260" y="316" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AI CONFIDENCE: 95.4% (NORMAL)</text>

  <!-- Right Column: Telemedicine & Security Stats -->
  <rect x="390" y="120" width="260" height="110" rx="8" fill="rgba(15,23,42,0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="410" y="145" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Security &amp; Auth Core</text>
  <text x="410" y="170" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">🔒 Speakeasy TOTP &amp; 2FA Guards</text>
  <text x="410" y="192" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">🌐 IP-Geolocated Remote Revocation</text>
  <text x="410" y="214" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">⚡ -30% API Response Optimization</text>

  <rect x="390" y="245" width="260" height="115" rx="8" fill="rgba(15,23,42,0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="410" y="270" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Clinic &amp; Booking Pipeline</text>
  <text x="410" y="295" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">📍 Leaflet Maps + Haversine Radius</text>
  <text x="410" y="317" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">📄 PDFKit Prescriptions &amp; Invoices</text>
  <text x="410" y="339" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">🕒 Cron Scheduler (Status Lifecycle)</text>

</svg>
