<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0712" />
      <stop offset="50%" stop-color="#190d24" />
      <stop offset="100%" stop-color="#07040b" />
    </linearGradient>
  </defs>

  <rect width="1000" height="580" fill="url(#gBg)" />

  <rect x="25" y="20" width="950" height="540" rx="14" fill="#130b1c" stroke="rgba(225,0,152,0.25)" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="25" y="20" width="950" height="42" rx="14" fill="#1f102e" />
  <circle cx="52" cy="41" r="5.5" fill="#ef4444" />
  <circle cx="70" cy="41" r="5.5" fill="#f59e0b" />
  <circle cx="88" cy="41" r="5.5" fill="#10b981" />
  <text x="500" y="46" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">GraphQL Playground — Enterprise MS SQL Server Service</text>

  <!-- Left: GraphQL Query Editor -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="440" height="455" rx="10" fill="#0c0712" stroke="rgba(255,255,255,0.06)" />
    <text x="20" y="28" fill="#e10098" font-family="monospace" font-size="12" font-weight="700">QUERY EDITOR (SDL &amp; Code-First)</text>
    <line x1="0" y1="42" x2="440" y2="42" stroke="rgba(255,255,255,0.06)" />

    <text x="20" y="75" fill="#e10098" font-family="monospace" font-size="12">query <tspan fill="#38bdf8">FetchCatalogAndMetrics</tspan> {</text>
    <text x="40" y="105" fill="#f8fafc" font-family="monospace" font-size="12">books(limit: <tspan fill="#fbbf24">5</tspan>, sortBy: <tspan fill="#34d399">"rating"</tspan>) {</text>
    <text x="65" y="135" fill="#38bdf8" font-family="monospace" font-size="12">id</text>
    <text x="65" y="160" fill="#38bdf8" font-family="monospace" font-size="12">title</text>
    <text x="65" y="185" fill="#38bdf8" font-family="monospace" font-size="12">author</text>
    <text x="65" y="210" fill="#38bdf8" font-family="monospace" font-size="12">price</text>
    <text x="65" y="235" fill="#38bdf8" font-family="monospace" font-size="12">inStock</text>
    <text x="40" y="265" fill="#f8fafc" font-family="monospace" font-size="12">}</text>
    <text x="40" y="295" fill="#f8fafc" font-family="monospace" font-size="12">poolMetrics {</text>
    <text x="65" y="325" fill="#38bdf8" font-family="monospace" font-size="12">activeConnections</text>
    <text x="65" y="350" fill="#38bdf8" font-family="monospace" font-size="12">avgQueryLatencyMs</text>
    <text x="40" y="380" fill="#f8fafc" font-family="monospace" font-size="12">}</text>
    <text x="20" y="410" fill="#e10098" font-family="monospace" font-size="12">}</text>

    <rect x="340" y="10" width="80" height="26" rx="13" fill="#e10098" />
    <text x="380" y="27" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">▶ RUN</text>
  </g>

  <!-- Right: JSON Payload Response & MS SQL Pool State -->
  <g transform="translate(510, 80)">
    <rect x="0" y="0" width="445" height="455" rx="10" fill="#0c0712" stroke="rgba(255,255,255,0.06)" />
    <text x="20" y="28" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">RESPONSE (200 OK • 12ms)</text>
    <line x1="0" y1="42" x2="445" y2="42" stroke="rgba(255,255,255,0.06)" />

    <text x="20" y="70" fill="#94a3b8" font-family="monospace" font-size="11">{</text>
    <text x="35" y="90" fill="#38bdf8" font-family="monospace" font-size="11">"data": {</text>
    <text x="50" y="110" fill="#38bdf8" font-family="monospace" font-size="11">"books": [</text>
    
    <text x="65" y="130" fill="#94a3b8" font-family="monospace" font-size="11">{ "id": "1", "title": "Clean Architecture", "price": 34.99 },</text>
    <text x="65" y="150" fill="#94a3b8" font-family="monospace" font-size="11">{ "id": "2", "title": "Designing Data-Intensive Apps", "price": 42.50 },</text>
    <text x="65" y="170" fill="#94a3b8" font-family="monospace" font-size="11">{ "id": "3", "title": "High Performance Browser Networking", "price": 38.00 }</text>
    <text x="50" y="190" fill="#38bdf8" font-family="monospace" font-size="11">],</text>
    
    <text x="50" y="215" fill="#38bdf8" font-family="monospace" font-size="11">"poolMetrics": {</text>
    <text x="65" y="235" fill="#94a3b8" font-family="monospace" font-size="11">"activeConnections": <tspan fill="#34d399">12</tspan>,</text>
    <text x="65" y="255" fill="#94a3b8" font-family="monospace" font-size="11">"idleConnections": <tspan fill="#34d399">8</tspan>,</text>
    <text x="65" y="275" fill="#94a3b8" font-family="monospace" font-size="11">"avgQueryLatencyMs": <tspan fill="#fbbf24">11.4</tspan></text>
    <text x="50" y="295" fill="#38bdf8" font-family="monospace" font-size="11">}</text>
    <text x="35" y="315" fill="#94a3b8" font-family="monospace" font-size="11">}</text>
    <text x="20" y="335" fill="#94a3b8" font-family="monospace" font-size="11">}</text>

    <!-- Bottom Feature Bar -->
    <rect x="20" y="355" width="405" height="80" rx="6" fill="#1b1126" stroke="rgba(225,0,152,0.2)" />
    <text x="35" y="380" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">MS SQL Enterprise Pool Guard</text>
    <text x="35" y="400" fill="#94a3b8" font-family="sans-serif" font-size="10">✓ Parameterized SQL Prepared Statements</text>
    <text x="35" y="420" fill="#94a3b8" font-family="sans-serif" font-size="10">✓ Dual SDL &amp; Code-First Schema Support</text>
  </g>
</svg>
